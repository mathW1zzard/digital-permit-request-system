; Week 16 staging PHP settings. start.sh appends these to the installed php.ini (later values win),
; so the development PHP on this laptop is not changed.

; Errors go to the log, never to the response.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; Request limits that agree with the application (D7: the app refuses bodies over 1 MB).
post_max_size = 2M
upload_max_filesize = 1M
max_execution_time = 30
memory_limit = 256M

; Compiled-code cache. Code only changes on deploy, and deploy restarts the workers.
zend_extension = opcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
